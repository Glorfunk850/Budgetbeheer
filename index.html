<style>
/* Layout: één kolom met kop, tabbladen en periodenavigatie; samenvatting boven, detail eronder. */
:root {
  color-scheme: light;
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #5b6875;
  --line: #dde3e9;
  --accent: #1d4f7a;
  --accent-ink: #ffffff;
  --accent-soft: #e3edf6;
  --pos: #0b7a4b;
  --neg: #c0392b;
  --s-in: #1baf7a;
  --s-out: #e34948;
  --s-seq: #2a78d6;
  --good: #0ca30c;
  --warn: #c98500;
  --crit: #d03b3b;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121820;
    --surface: #1a222c;
    --ink: #e9eef3;
    --muted: #9fadba;
    --line: #2c3743;
    --accent: #8cbbe6;
    --accent-ink: #0d1a26;
    --accent-soft: #22303e;
    --pos: #4fd39a;
    --neg: #ff8a7d;
    --s-in: #199e70;
    --s-out: #e66767;
    --s-seq: #3987e5;
    --warn: #fab219;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121820;
  --surface: #1a222c;
  --ink: #e9eef3;
  --muted: #9fadba;
  --line: #2c3743;
  --accent: #8cbbe6;
  --accent-ink: #0d1a26;
  --accent-soft: #22303e;
  --pos: #4fd39a;
  --neg: #ff8a7d;
  --s-in: #199e70;
  --s-out: #e66767;
  --s-seq: #3987e5;
  --warn: #fab219;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 96px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; text-wrap: balance; }
.store-note { font-size: 13px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }
nav.tabs .ti { display: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* Smartphone: alle tabbladen passen naast elkaar, met icoon en kort label, zonder horizontaal schuiven. */
@media (max-width: 600px) {
  nav.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; overflow: visible; }
  nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; font-size: 11px; letter-spacing: -0.02em; text-align: center; min-width: 0; }
  nav.tabs a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  nav.tabs .ti { display: block; }
}
.period { display: flex; align-items: center; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.period .label { font-family: var(--font-display); font-size: 21px; min-width: 0; flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--neg); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.icon { width: 38px; padding: 7px 0; text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .sub { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile.saldo { border-color: var(--accent); background: var(--accent-soft); }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card + .card { margin-top: 16px; }
.grid2 .card + .card { margin-top: 0; }
.chart-box { position: relative; height: 260px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: center; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--accent-soft); }
.row .t { font-weight: 600; }
.row .m { font-size: 13px; color: var(--muted); }
.row .a { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.chip { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--muted); font-weight: 600; margin-left: 6px; vertical-align: 1px; }
.day-h { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; color: var(--muted); text-transform: capitalize; padding: 12px 4px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 10px 4px; font-size: 14px; }
.budget { padding: 8px 0; border-bottom: 1px solid var(--line); }
.budget:last-child { border-bottom: 0; }
.budget .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.budget .top b { font-weight: 600; }
.budget .nums { font-variant-numeric: tabular-nums; color: var(--muted); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--st); }
.status { font-size: 12px; font-weight: 700; color: var(--st); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--accent-soft); }
tfoot td { font-weight: 700; border-bottom: 0; }
.scroll-x { overflow-x: auto; }
.fab { position: fixed; right: 20px; bottom: 20px; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; line-height: 1; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.22); z-index: 20; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; margin: 16px 0 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.banner p { margin: 0; flex: 1 1 320px; }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.toolbar input, .toolbar select, .field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 200px; }
dialog { border: 0; border-radius: 14px; padding: 0; background: var(--surface); color: var(--ink); width: min(460px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(10, 20, 30, .45); }
.dlg { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.dlg h3 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0; }
.dlg .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.dlg .acts .left { margin-right: auto; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 9px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"].in { background: var(--pos); color: #fff; }
.seg button[aria-pressed="true"].out { background: var(--neg); color: #fff; }
.seg button[aria-pressed="true"].refund { background: var(--accent); color: var(--accent-ink); }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.amount-input { font-size: 22px !important; font-weight: 700; font-variant-numeric: tabular-nums; }
.err { color: var(--neg); font-size: 13px; min-height: 1em; }
textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); font: 12px/1.4 ui-monospace, Menlo, monospace; }
.cat-list { display: flex; flex-direction: column; gap: 6px; }
.cat-item { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.cat-item input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 9px; min-width: 0; }
.budget-item { display: grid; grid-template-columns: 1fr 130px; gap: 8px; align-items: center; padding: 4px 0; }
.budget-item input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 9px; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.loading { padding: 40px 0; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 50; max-width: calc(100vw - 32px); }
@media (max-width: 760px) {
  .grid2 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tiles .tile.saldo { grid-column: 1 / -1; }
  .tile .v { font-size: 22px; }
}
@media (max-width: 420px) {
  .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
"use strict";
/* ---------- Hulpfuncties ---------- */
const EUR = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR" });
const NUM = new Intl.NumberFormat("nl-BE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = n => EUR.format(n || 0);
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const MON_S = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAYS = ["maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag","zondag"];
const DAYS_S = ["ma","di","wo","do","vr","za","zo"];
const pad = n => String(n).padStart(2, "0");
const ds = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const ym = s => s.slice(0, 7);
const r2 = n => Math.round(n * 100) / 100;
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayS = () => ds(new Date());
function parseAmount(v) {
  if (typeof v === "number") return v;
  let s = String(v || "").trim().replace(/[€\s]/g, "");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) {
    if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (s.includes(",")) s = s.replace(",", ".");
  return Number(s);
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

/* ---------- Gegevensmodel ---------- */
const DEFAULT_CATS = {
  in: ["Loon", "Groeipakket", "Overige"],
  out: ["Wonen", "Boodschappen", "Vervoer", "Energie & water", "Verzekeringen", "Gezondheid", "Vrije tijd", "Kleding", "Abonnementen", "Sparen", "Overige"]
};
const defaultSettings = () => ({ cats: { in: [...DEFAULT_CATS.in], out: [...DEFAULT_CATS.out] }, budgets: {}, recurring: [] });
let R = { settings: defaultSettings(), months: {} }; // opgeslagen gegevens
let S = R; // wat getoond wordt (R, of voorbeelddata)
let pendingCharts = [];
let demo = false;
let loaded = false;

function normalizeSettings(d) {
  const s = defaultSettings();
  if (d && d.cats) {
    if (Array.isArray(d.cats.in)) s.cats.in = d.cats.in.map(String);
    if (Array.isArray(d.cats.out)) s.cats.out = d.cats.out.map(String);
  }
  if (d && d.budgets && typeof d.budgets === "object") s.budgets = { ...d.budgets };
  if (d && Array.isArray(d.recurring)) s.recurring = d.recurring.filter(r => r && r.start && r.freq);
  return s;
}

function recurringInstances(rule, from, to) {
  const out = [];
  const start = rule.start, end = rule.end || "9999-12-31";
  const lo = from > start ? from : start;
  const hi = to < end ? to : end;
  if (lo > hi) return out;
  const mk = date => ({ id: "r:" + rule.id + ":" + date, ruleId: rule.id, recurring: true, date, type: rule.type, amount: rule.amount, cat: rule.cat, desc: rule.desc || "" });
  if (rule.freq === "week") {
    let d = pd(start);
    const loD = pd(lo);
    if (d < loD) d = addDays(d, Math.ceil((loD - d) / 86400000 / 7) * 7);
    while (ds(d) <= hi) { out.push(mk(ds(d))); d = addDays(d, 7); }
  } else {
    const day = pd(start).getDate();
    let y = +lo.slice(0, 4), m = +lo.slice(5, 7) - 1;
    for (let i = 0; i < 1200; i++) {
      const date = ds(new Date(y, m, Math.min(day, dim(y, m))));
      if (date > hi) break;
      if (date >= lo) out.push(mk(date));
      m++; if (m > 11) { m = 0; y++; }
    }
  }
  return out;
}

function getRange(from, to) {
  const list = [];
  for (const k of Object.keys(S.months)) {
    if (k < ym(from) || k > ym(to)) continue;
    for (const t of S.months[k]) if (t.date >= from && t.date <= to) list.push(t);
  }
  for (const r of S.settings.recurring) list.push(...recurringInstances(r, from, to));
  list.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  return list;
}
function totals(list) {
  let inc = 0, out = 0, ref = 0;
  for (const t of list) { if (t.type === "in") inc += t.amount; else if (t.type === "refund") ref += t.amount; else out += t.amount; }
  return { inc: r2(inc), out: r2(out - ref), saldo: r2(inc - out + ref), ref: r2(ref) };
}
const catType = type => type === "in" ? "in" : "out";
let refundMap = new Map();
function buildRefundMap() {
  refundMap = new Map();
  for (const t of allStored()) if (t.type === "refund" && t.linkId) refundMap.set(t.linkId, r2((refundMap.get(t.linkId) || 0) + t.amount));
}
function allStored() { return Object.values(S.months).flat(); }

/* ---------- Opslag ---------- */
let db = null, base = null, storeMode = "none";
const dirty = new Set(), inflight = new Set();
const lastSaved = new Map();
const LS_KEY = "budgetbeheer-v1";

function docBodies() {
  const m = new Map();
  m.set("settings", S.settings);
  for (const [k, list] of Object.entries(S.months)) if (list.length) m.set("m-" + k, { tx: list });
  return m;
}
function persist() {
  if (demo) return;
  const bodies = docBodies();
  const ids = new Set([...bodies.keys(), ...lastSaved.keys()]);
  for (const id of ids) {
    const b = bodies.get(id);
    const j = b ? JSON.stringify(b) : null;
    if (j !== (lastSaved.get(id) ?? null)) {
      if (j === null) lastSaved.delete(id); else lastSaved.set(id, j);
      if (storeMode === "db") { dirty.add(id); if (!inflight.has(id)) runWrite(id); }
    }
  }
  if (storeMode === "local") {
    try { localStorage.setItem(LS_KEY, JSON.stringify(R)); } catch (e) { /* niet beschikbaar */ }
  }
}
async function runWrite(id) {
  inflight.add(id);
  while (dirty.has(id)) {
    dirty.delete(id);
    const j = lastSaved.get(id);
    const ref = db.collection(base).doc(id);
    try {
      if (j == null) await ref.delete(); else await ref.set(JSON.parse(j));
    } catch (e) {
      if (e && e.code === "unavailable") {
        await new Promise(r => setTimeout(r, 600 + Math.random() * 800));
        dirty.add(id);
      } else if (e && e.code === "quota_exceeded") {
        toast("Opslaan mislukt: de opslag is vol. Verwijder oude transacties.");
      } else {
        toast("Opslaan mislukt. Probeer het later opnieuw.");
      }
    }
  }
  inflight.delete(id);
}
function onSnap(snap) {
  const seen = new Set();
  for (const d of snap.docs) {
    seen.add(d.id);
    if (dirty.has(d.id) || inflight.has(d.id)) continue;
    const data = d.data();
    if (d.id === "settings") R.settings = normalizeSettings(data);
    else if (d.id.startsWith("m-")) R.months[d.id.slice(2)] = Array.isArray(data.tx) ? data.tx.slice() : [];
    lastSaved.set(d.id, JSON.stringify(d.id === "settings" ? R.settings : { tx: R.months[d.id.slice(2)] }));
  }
  if (!snap.metadata.fromCache) {
    for (const id of [...lastSaved.keys()]) {
      if (seen.has(id) || dirty.has(id) || inflight.has(id)) continue;
      lastSaved.delete(id);
      if (id === "settings") R.settings = defaultSettings(); else delete R.months[id.slice(2)];
    }
  }
  if (!loaded && !snap.metadata.fromCache) {
    loaded = true;
    if (snap.empty) startDemo();
  }
  render();
}

async function initStore() {
  let user = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    }
  } catch (e) { db = null; }
  let id = null;
  if (db && user) { try { id = await user.id(); } catch (e) { id = null; } }
  if (db && id) {
    storeMode = "db";
    base = "data/users/" + id;
    document.getElementById("storeNote").textContent = "Privé opgeslagen in je account";
    const timer = setTimeout(() => {
      if (!loaded) { document.getElementById("storeNote").textContent = "Gegevens nog niet bereikbaar…"; }
    }, 10000);
    db.collection(base).onSnapshot(snap => { if (!snap.metadata.fromCache) clearTimeout(timer); onSnap(snap); },
      err => {
        clearTimeout(timer);
        document.getElementById("storeNote").textContent = "Opslag niet bereikbaar, wijzigingen worden niet bewaard";
        storeMode = "none";
        if (!loaded) { loaded = true; startDemo(); render(); }
      });
  } else {
    storeMode = "local";
    let raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) { storeMode = "none"; }
    if (raw) {
      try { const p = JSON.parse(raw); R = S = { settings: normalizeSettings(p.settings), months: p.months || {} }; } catch (e) { /* negeren */ }
    }
    document.getElementById("storeNote").textContent = storeMode === "local" ? "Opgeslagen in deze browser" : "Wijzigingen worden niet bewaard";
    loaded = true;
    if (!raw) startDemo();
    render();
  }
}

function startDemo() {
  demo = true;
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const settings = defaultSettings();
  const now = new Date();
  const s0 = new Date(now.getFullYear(), now.getMonth() - 3, 1);
  settings.recurring = [
    { id: "d1", type: "in", amount: 2650, cat: "Loon", desc: "Nettoloon", freq: "month", start: ds(new Date(s0.getFullYear(), s0.getMonth(), 25)) },
    { id: "d2", type: "in", amount: 182.5, cat: "Groeipakket", desc: "Groeipakket", freq: "month", start: ds(new Date(s0.getFullYear(), s0.getMonth(), 10)) },
    { id: "d3", type: "out", amount: 875, cat: "Wonen", desc: "Huur", freq: "month", start: ds(new Date(s0.getFullYear(), s0.getMonth(), 1)) },
    { id: "d4", type: "out", amount: 145, cat: "Energie & water", desc: "Voorschot energie", freq: "month", start: ds(new Date(s0.getFullYear(), s0.getMonth(), 5)) },
    { id: "d5", type: "out", amount: 13.99, cat: "Abonnementen", desc: "Streamingdienst", freq: "month", start: ds(new Date(s0.getFullYear(), s0.getMonth(), 12)) },
    { id: "d6", type: "out", amount: 150, cat: "Sparen", desc: "Spaarrekening", freq: "month", start: ds(new Date(s0.getFullYear(), s0.getMonth(), 26)) }
  ];
  settings.budgets = { "Boodschappen": 420, "Vrije tijd": 150, "Kleding": 100, "Vervoer": 140, "Gezondheid": 60 };
  const months = {};
  const add = (date, type, amount, cat, desc, linkId) => { const k = ym(date); const id = uid() + Math.floor(rnd() * 1e6); const t = { id, date, type, amount: r2(amount), cat, desc }; if (linkId) t.linkId = linkId; (months[k] = months[k] || []).push(t); return id; };
  const end = todayS();
  const shops = ["Delhaize", "Colruyt", "Aldi", "Lidl", "Bakker"];
  for (let d = new Date(s0); ds(d) <= end; d = addDays(d, 1)) {
    const date = ds(d), wd = (d.getDay() + 6) % 7;
    if (wd === 5 || rnd() < 0.18) add(date, "out", 25 + rnd() * 70, "Boodschappen", shops[Math.floor(rnd() * shops.length)]);
    if (wd < 5 && rnd() < 0.12) add(date, "out", 35 + rnd() * 30, "Vervoer", rnd() < 0.5 ? "Tanken" : "Treinticket");
    if (wd >= 4 && rnd() < 0.3) add(date, "out", 12 + rnd() * 45, "Vrije tijd", ["Restaurant", "Cinema", "Café", "Zwembad"][Math.floor(rnd() * 4)]);
    if (rnd() < 0.04) add(date, "out", 25 + rnd() * 70, "Kleding", "Kleding");
    if (rnd() < 0.03) add(date, "out", 15 + rnd() * 40, "Gezondheid", "Apotheek");
    if (d.getDate() === 15 && rnd() < 0.7) add(date, "out", 38.6, "Verzekeringen", "Familiale verzekering");
    if (d.getDate() === 3) { const id = add(date, "out", 60, "Gezondheid", "Tandarts"); const back = addDays(d, 6); if (ds(back) <= end) add(ds(back), "refund", 45, "Gezondheid", "Terugbetaling mutualiteit", id); }
  }
  S = { settings, months };
}
const realEmpty = () => !Object.keys(R.months).length && !R.settings.recurring.length;
function endDemo(keep) {
  if (!demo) return;
  demo = false;
  if (keep && realEmpty()) { R.settings = S.settings; R.months = S.months; }
  S = R;
  persist();
  render();
}
function mutate(fn) {
  if (demo) { demo = false; S = R; }
  fn();
  R = S;
  persist();
  render();
}

  const inc = Array(7).fill(0), out = Array(7).fill(0);
  for (const x of list) { const i = (pd(x.date).getDay() + 6) % 7; if (x.type === "in") inc[i] += x.amount; else if (x.type === "refund") out[i] -= x.amount; else out[i] += x.amount; }

function catTotals(list, type) {

    else if (type === "out" && t.type === "refund") m.set(t.cat, (m.get(t.cat) || 0) - t.amount);

/* ---------- CSV & back-up ---------- */
function csvCell(v) { const s = String(v ?? ""); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function buildCSV() {
  const rows = [["datum", "type", "bedrag", "categorie", "omschrijving"]];
  for (const t of allStored().sort((a, b) => a.date < b.date ? -1 : 1)) rows.push([t.date, t.type === "in" ? "inkomst" : t.type === "refund" ? "terugbetaling" : "uitgave", NUM.format(t.amount).replace(/\./g, ""), t.cat, t.desc || ""]);
  return "﻿" + rows.map(r => r.map(csvCell).join(";")).join("\r\n");
}
async function offerFile(filename, data, title) {
  try {
    const dl = window.claude && await window.claude.use("downloads");
    if (dl) { await dl.save({ filename, data }); return; }
  } catch (e) { if (e && /declin|cancel|abort/i.test(String(e.code || e.message))) return; }
  try {
    const type = filename.endsWith(".json") ? "application/json" : "text/csv;charset=utf-8";
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return;
  } catch (e) { /* val terug op kopiëren */ }
  openDlg(`<div class="dlg"><h3>${esc(title)}</h3><p class="hint" style="margin:0">Downloaden lukt hier niet. Kopieer de inhoud en bewaar ze als <b>${esc(filename)}</b>.</p><textarea id="dlText" readonly>${esc(data)}</textarea><div class="acts"><button class="btn" id="dlClose">Sluiten</button><button class="btn primary" id="dlCopy">Kopiëren</button></div></div>`);
  document.getElementById("dlClose").onclick = closeDlg;
  document.getElementById("dlCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(data); toast("Gekopieerd"); }
    catch (e) { const ta = document.getElementById("dlText"); ta.select(); toast("Selecteer en kopieer met Ctrl+C"); }
  };
}
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const sep = [";", "\t", ","].map(s => [s, first.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function parseDate(s) {
  s = String(s || "").trim();
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return y + "-" + pad(m[2]) + "-" + pad(m[1]); }
  return null;
}
function importCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { added: 0, skipped: 0 };
  const h = rows[0].map(x => x.trim().toLowerCase());
  const find = keys => h.findIndex(x => keys.some(k => x.includes(k)));
  let iDate = find(["datum", "date", "uitvoering", "boekingsdatum"]), iAmt = find(["bedrag", "amount", "montant"]), iType = find(["type"]), iCat = find(["categorie", "category"]), iDesc = find(["omschrijving", "mededeling", "description", "naam tegenpartij", "tegenpartij"]);
  let start = 1;
  if (iDate < 0 || iAmt < 0) { iDate = 0; iType = 1; iAmt = 2; iCat = 3; iDesc = 4; start = parseDate(rows[0][0]) ? 0 : 1; }
  let added = 0, skipped = 0;
  const newCats = { in: new Set(), out: new Set() };
  const list = [];
  for (const r of rows.slice(start)) {
    const date = parseDate(r[iDate]);
    let amt = parseAmount(r[iAmt]);
    if (!date || !isFinite(amt) || amt === 0) { skipped++; continue; }
    let type = amt < 0 ? "out" : "in";
    if (iType >= 0 && r[iType]) { const tv = r[iType].toLowerCase(); if (/terug|refund/.test(tv)) type = "refund"; else if (/uit|out|debet|exp/.test(tv)) type = "out"; else if (/in|credit|ink/.test(tv)) type = "in"; }
    let cat = iCat >= 0 && r[iCat] ? r[iCat].trim() : "Overige";
    if (!S.settings.cats[catType(type)].includes(cat)) newCats[catType(type)].add(cat);
    list.push({ id: uid() + added, date, type, amount: r2(Math.abs(amt)), cat, desc: iDesc >= 0 ? (r[iDesc] || "").trim().slice(0, 140) : "" });
    added++;
  }
  if (added) mutate(() => {
    for (const ty of ["in", "out"]) for (const c of newCats[ty]) if (!S.settings.cats[ty].includes(c)) S.settings.cats[ty].push(c);
    for (const t of list) addTx(t);
  });
  return { added, skipped };
}
let fileMode = "csv";
document.getElementById("fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    const text = String(rd.result || "");
    if (fileMode === "json") {
      let p;
      try { p = JSON.parse(text); } catch (err) { toast("Dit bestand is geen geldige back-up."); return; }
      if (!p || !p.settings || !p.months) { toast("Dit bestand is geen geldige back-up."); return; }
      const ok = await confirmDlg("Back-up terugzetten?", "Je huidige gegevens worden vervangen door de back-up.", "Terugzetten");
      if (!ok) return;
      mutate(() => { S = { settings: normalizeSettings(p.settings), months: p.months }; });
      toast("Back-up teruggezet");
    } else {
      const r = importCSV(text);
      toast(r.added ? `${r.added} transacties geïmporteerd${r.skipped ? ", " + r.skipped + " regels overgeslagen" : ""}` : "Geen transacties gevonden in dit bestand.");
    }
  };
  rd.readAsText(f);
});

  if (rule) { const r = S.settings.recurring.find(x => x.id === rule.dataset.rule); if (r) openTxForm({ rule: r }); return; }
  const mrow = e.target.closest("[data-month]");
  if (mrow) { anchor = new Date(anchor.getFullYear(), +mrow.dataset.month, 1); location.hash = "maand"; return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act, k = act.dataset.k;
  if (a === "demo-keep") endDemo(true);
  else if (a === "demo-clear") endDemo(false);
  else if (a === "more") { txFilter.limit += 150; render(); }
  else if (a === "export") offerFile("budget-" + todayS() + ".csv", buildCSV(), "CSV exporteren");
  else if (a === "import") { fileMode = "csv"; document.getElementById("fileIn").click(); }
  else if (a === "backup") offerFile("budget-backup-" + todayS() + ".json", JSON.stringify(S, null, 1), "Back-up");
  else if (a === "restore") { fileMode = "json"; document.getElementById("fileIn").click(); }
  else if (a === "demo") {
    if (allStored().length || S.settings.recurring.length) { const ok = await confirmDlg("Voorbeelddata bekijken?", "Je eigen gegevens blijven bewaard. Klik daarna op ‘Terug naar mijn gegevens’.", "Bekijken"); if (!ok) return; }
    startDemo(); render();
  }
  else if (a === "wipe") {
    const ok = await confirmDlg("Alles wissen?", "Alle transacties, categorieën, budgetten en terugkerende transacties worden verwijderd. Maak eventueel eerst een back-up.", "Alles wissen");
    if (ok) { mutate(() => { S = { settings: defaultSettings(), months: {} }; }); toast("Alles gewist"); }
  }
  else if (a === "savebudgets") {
    const b = {};
    let bad = false;
    document.querySelectorAll("[data-budget]").forEach(inp => { const v = inp.value.trim(); if (!v) return; const n = parseAmount(v); if (n > 0) b[inp.dataset.budget] = r2(n); else bad = true; });
    if (bad) { toast("Controleer de bedragen: gebruik getallen zoals 250 of 99,50."); return; }
    mutate(() => { S.settings.budgets = b; });
    toast("Budgetten opgeslagen");
  }
  else if (a === "addcat") {
    const inp = document.getElementById("newcat-" + k), name = inp.value.trim();
    if (!name) return;
    if (S.settings.cats[k].includes(name)) { toast("Die categorie bestaat al."); return; }
    mutate(() => { S.settings.cats[k].push(name); });
  }
  else if (a === "rename") {
    const [type, i] = k.split(":"), old = S.settings.cats[type][+i];
    const name = document.querySelector(`[data-rename="${k}"]`).value.trim();
    if (!name || name === old) return;
    if (S.settings.cats[type].includes(name)) { toast("Die categorie bestaat al."); return; }
    mutate(() => renameCat(type, old, name));
    toast("Hernoemd");
  }
  else if (a === "delcat") {
    const [type, i] = k.split(":"), name = S.settings.cats[type][+i];
    const used = allStored().filter(t => catType(t.type) === type && t.cat === name).length + S.settings.recurring.filter(r => catType(r.type) === type && r.cat === name).length;
    const ok = await confirmDlg(`‘${name}’ verwijderen?`, used ? `${used} transactie(s) gebruiken deze categorie. Die komen onder ‘Overige’.` : "Deze categorie wordt nergens gebruikt.", "Verwijderen");
    if (!ok) return;
    mutate(() => {
      S.settings.cats[type] = S.settings.cats[type].filter(c => c !== name);
      if (used) { if (!S.settings.cats[type].includes("Overige")) S.settings.cats[type].push("Overige"); renameCat(type, name, "Overige", true); }
      delete S.settings.budgets[name];
    });
  }
});
function renameCat(type, old, name, keepList) {
  if (!keepList) S.settings.cats[type] = S.settings.cats[type].map(c => c === old ? name : c);
  for (const l of Object.values(S.months)) for (const t of l) if (catType(t.type) === type && t.cat === old) t.cat = name;
  for (const r of S.settings.recurring) if (catType(r.type) === type && r.cat === old) r.cat = name;
  if (type === "out" && S.settings.budgets[old] != null) { if (!keepList) S.settings.budgets[name] = S.settings.budgets[old]; delete S.settings.budgets[old]; }
}
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-tx],[data-rule],[data-month]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "fq") { txFilter.q = e.target.value; txFilter.limit = 150; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "ft") { txFilter.type = e.target.value; render(); }
  if (e.target.id === "fc") { txFilter.cat = e.target.value; render(); }
});
const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
if (darkMQ.addEventListener) darkMQ.addEventListener("change", () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

readHash();
initStore();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
